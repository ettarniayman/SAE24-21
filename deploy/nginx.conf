server {
    listen 80;
    server_name rtvoyage.com www.rtvoyage.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rtvoyage.com www.rtvoyage.com;

    ssl_certificate     /etc/letsencrypt/live/rtvoyage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtvoyage.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Static files served directly (bypass Flask)
    location /static/ {
        alias /var/www/rtvoyage/flask/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads
    location /static/images/uploads/ {
        alias /var/www/rtvoyage/flask/app/static/images/uploads/;
        expires 7d;
    }

    # Flask app via gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
        client_max_body_size 20M;
    }
}
