ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName rtvoyage.local
    ServerAlias www.rtvoyage.local

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; frame-src 'self' https://www.google.com https://www.youtube.com https://youtube.com https://player.vimeo.com;"

    # Compression
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json

    # Cache static assets
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$">
        Header set Cache-Control "max-age=2592000, public"
    </LocationMatch>

    # Serve static files directly via Apache
    Alias /static /var/www/static
    <Directory /var/www/static>
        Options -Indexes
        AllowOverride None
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
    </Directory>

    # Reverse Proxy vers Flask/Gunicorn
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass / http://flask:5000/
    ProxyPassReverse / http://flask:5000/

    # Logs
    ErrorLog /usr/local/apache2/logs/rtvoyage_error.log
    CustomLog /usr/local/apache2/logs/rtvoyage_access.log combined

    LogLevel warn
</VirtualHost>
