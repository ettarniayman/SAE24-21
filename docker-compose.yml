version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rtvoyage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtvoyage}
      POSTGRES_USER: ${POSTGRES_USER:-rtvoyage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtvoyage_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/schema/views_triggers.sql:/docker-entrypoint-initdb.d/02_views_triggers.sql:ro
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - rtvoyage_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtvoyage_user} -d ${POSTGRES_DB:-rtvoyage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask:
    build:
      context: ./flask
      dockerfile: Dockerfile
    container_name: rtvoyage_flask
    restart: unless-stopped
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change_this_super_secret_key_2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rtvoyage_user}:${POSTGRES_PASSWORD:-rtvoyage_secret_2026}@postgres:5432/${POSTGRES_DB:-rtvoyage}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      UPLOAD_FOLDER: /app/static/images/uploads
    volumes:
      - ./flask:/app
      - uploads_data:/app/app/static/images/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rtvoyage_net
    expose:
      - "5000"

  apache:
    build:
      context: ./apache
      dockerfile: Dockerfile
    container_name: rtvoyage_apache
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - flask
    networks:
      - rtvoyage_net
    volumes:
      - ./flask/app/static:/var/www/static:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rtvoyage_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rtvoyage.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin2026}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - rtvoyage_net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  uploads_data:
  pgadmin_data:

networks:
  rtvoyage_net:
    driver: bridge
